# Windows CI (job `windows`) and Linux CI (job `linux`, PROGRESS_Linux.md stage L1).
# Windows: runs tests, builds the release exe and packs it (with the two DLLs) into the installer.
# The installer is the only artifact: there is no standalone radiant.exe or portable zip.
# TODO: add a release job (installer + GitHub Release) when the app is usable.
# TODO: separate legacy workflow for Windows 7/8.1 only if that stretch goal is pursued.
name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --target x86_64-pc-windows-msvc
      # radiant.exe is only an input for the installer (it is packed into it), it is not uploaded on its own.
      - name: Build release
        run: cargo build --release -p radiant-ui --target x86_64-pc-windows-msvc

      # ---- Installer (crates/radiant-setup, PROGRESS.md stage 14) ----
      # Builds the setup program and the `pack` tool; `pack` glues radiant.exe + the two DLLs + LICENSE.md to the end of
      # the setup exe. The setup exe is also what becomes uninstall.exe in the app folder (it copies itself without
      # the payload). README files and PROGRESS.md are not packed.
      - name: Build installer
        run: cargo build --release -p radiant-setup --target x86_64-pc-windows-msvc

      # The two files that must always sit next to radiant.exe, plus the license texts that come with them (MIT/Microsoft
      # terms ask to ship them). The NuGet packages are always downloaded for the license texts. A copy of a DLL in
      # installer/redist/ (committed to the repo) wins over the NuGet one; a DLL taken from NuGet is checked against the
      # SHA-256 of the exact file the app was tested with. To update a DLL: change the version and the hash below.
      - name: Collect the files for the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force -Path payload | Out-Null
          $dlls = @(
            @{ Name = 'onnxruntime.dll'; Short = 'ONNXRuntime'; Package = 'Microsoft.ML.OnnxRuntime.DirectML'; Version = '1.22.1'; Inner = 'runtimes/win-x64/native/onnxruntime.dll'; Sha = 'f722dd91a311b9fa4b7f2341d22c379a72fb7bc5b639df18b64821f23cdde14b' },
            @{ Name = 'DirectML.dll'; Short = 'DirectML'; Package = 'Microsoft.AI.DirectML'; Version = '1.15.4'; Inner = 'bin/x64-win/DirectML.dll'; Sha = '9c9e6d822561c6c41b90e6994b3e8857cf1d66dbfb1e0c4c799c7c89b4e92da1' }
          )
          foreach ($d in $dlls) {
            $zip = Join-Path $env:RUNNER_TEMP "$($d.Package).zip"
            $dir = Join-Path $env:RUNNER_TEMP $d.Package
            Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/$($d.Package)/$($d.Version)" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dir -Force

            $local = Join-Path 'installer/redist' $d.Name
            $dest = Join-Path 'payload' $d.Name
            if (Test-Path $local) {
              Copy-Item $local $dest
              Write-Host "$($d.Name): taken from the repository ($local)"
            } else {
              Copy-Item (Join-Path $dir $d.Inner) $dest
              Write-Host "$($d.Name): taken from NuGet ($($d.Package) $($d.Version))"
              $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
              if ($hash -ne $d.Sha) {
                throw "$($d.Name) from NuGet has SHA-256 $hash, expected $($d.Sha). Put the exact file you tested with into installer/redist/$($d.Name) (commit it) or update the hash in build.yml."
              }
            }
            Write-Host "$($d.Name) SHA-256: $((Get-FileHash $dest -Algorithm SHA256).Hash.ToLower())"

            # License texts of the package -> the app folder (LICENSE-<name>.txt, ThirdPartyNotices-<name>.txt).
            foreach ($f in @('LICENSE', 'ThirdPartyNotices')) {
              # Any extension (LICENSE, LICENSE.txt, LICENSE.md): packages are not consistent.
              $src = Get-ChildItem $dir -File -Filter "$f*" | Select-Object -First 1
              $target = Join-Path 'payload' "$f-$($d.Short).txt"
              if ($src) {
                Copy-Item $src.FullName $target
                Write-Host "$($src.Name) -> $(Split-Path $target -Leaf)"
              } else {
                Write-Warning "$f was not found in $($d.Package) $($d.Version): the installer will not contain it."
                Get-ChildItem $dir -File | ForEach-Object { Write-Host "  in the package root: $($_.Name)" }
              }
            }
          }
          $t = 'target/x86_64-pc-windows-msvc/release'
          Copy-Item "$t/radiant.exe" payload/radiant.exe
          Copy-Item LICENSE.md payload/LICENSE.md

      # Everything in payload/ goes into the installer (and the uninstaller removes exactly what was installed).
      - name: Pack installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $t = 'target/x86_64-pc-windows-msvc/release'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $files = Get-ChildItem payload -File | Sort-Object Name | ForEach-Object { $_.FullName }
          $files | ForEach-Object { Write-Host "payload: $_" }
          & "$t/pack.exe" "$t/radiant-setup.exe" dist/Radiant-Setup.exe $files
          if ($LASTEXITCODE -ne 0) { throw "pack.exe failed with code $LASTEXITCODE" }
          Get-ChildItem dist | ForEach-Object { Write-Host ("{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB)) }

      - uses: actions/upload-artifact@v7
        with:
          name: radiant-setup-windows-x64
          path: dist/Radiant-Setup.exe

  # Linux build on the oldest supported Ubuntu LTS, so the binary runs on newer glibc (PROGRESS_Linux.md stage L1).
  # The installer crate (radiant-setup) is Windows-only and is left out.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake libasound2-dev libfontconfig1-dev desktop-file-utils appstream
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p radiant-ui --target x86_64-unknown-linux-gnu
      # The list of shared libraries the binary needs at run time: used to check the dependency table in PROGRESS_Linux.md.
      - name: Show linked libraries
        run: |
          ls -l target/x86_64-unknown-linux-gnu/release/radiant
          ldd target/x86_64-unknown-linux-gnu/release/radiant
          objdump -p target/x86_64-unknown-linux-gnu/release/radiant | grep -E 'NEEDED' || true
          objdump -T target/x86_64-unknown-linux-gnu/release/radiant | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -n 1
      - name: Test
        run: cargo test --workspace --exclude radiant-setup --target x86_64-unknown-linux-gnu
      # Package resources (PROGRESS_Linux.md stage L3): the checks print what a distribution or a software center would say.
      - name: Validate desktop file and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/io.github.john3sobieski.Radiant.desktop
          appstreamcli validate --no-net packaging/linux/io.github.john3sobieski.Radiant.metainfo.xml
      - uses: actions/upload-artifact@v7
        with:
          name: radiant-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/radiant
