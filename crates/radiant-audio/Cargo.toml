[package]
name = "radiant-audio"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
radiant-dsp = { path = "../radiant-dsp" }
# Decoding. Opus uses libopus via a Symphonia adapter; HE-AAC still needs a separate check.
symphonia = { version = "0.5", features = ["all"] }
symphonia-adapter-libopus = "0.2"
# Sample-rate conversion (windowed sinc). Version 5 API; only sinc_core.rs uses it. No FFT resampler needed.
rubato = { version = "5", default-features = false }
# Output (WASAPI on Windows).
cpal = "0.15"
# Lock-free single-producer single-consumer ring buffer.
rtrb = "0.4"
