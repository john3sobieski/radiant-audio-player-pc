[package]
name = "radiant-ui"
version.workspace = true
edition.workspace = true
license-file.workspace = true
build = "build.rs"

[[bin]]
name = "radiant"
path = "src/main.rs"

[dependencies]
radiant-core = { path = "../radiant-core" }
radiant-audio = { path = "../radiant-audio" }
# TODO: wire radiant-dsp settings (then radiant-stems, radiant-cloud) here.

# Slint with default features for now.
# TODO: test the software renderer / lightest backend and pick by measuring RAM and CPU (README 2).
# TODO: check the Slint license option (royalty-free needs attribution) and add the notice.
slint = "1"
# Native folder dialog.
rfd = "0.15"
# Decodes cover art (embedded or cover.jpg/png) into small thumbnails for the track list.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[build-dependencies]
slint-build = "1"
