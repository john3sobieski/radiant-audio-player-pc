[package]
name = "radiant-cloud"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
# Audio file extensions and the OS random generator (PKCE verifier, state).
radiant-core = { path = "../radiant-core" }
# Blocking HTTPS client (rustls, no system TLS needed); the same setup as radiant-stems.
ureq = { version = "2", default-features = false, features = ["tls"] }
# SHA-256 for the PKCE code challenge.
sha2 = "0.10"
# Dropbox answers are JSON.
serde_json = "1"
