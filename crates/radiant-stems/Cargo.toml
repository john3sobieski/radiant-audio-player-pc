[package]
name = "radiant-stems"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
# Whole-file decode + resample to 44.1 kHz stereo (the same decoder as playback).
radiant-audio = { path = "../radiant-audio" }
# Streaming SHA-256 for the model file (the whole file never sits in memory).
sha2 = "0.10"
# Blocking HTTPS client for the one-time model download (rustls, no system TLS needed).
ureq = { version = "2", default-features = false, features = ["tls"] }
# STFT / iSTFT around the network (4096-point real FFT).
realfft = "3"
# ONNX Runtime. `load-dynamic`: onnxruntime.dll is loaded at run time from next to the exe (nothing is linked in, the
# exe stays small). Pinned: the API changes between release candidates. This version needs ONNX Runtime 1.22.x.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }

[features]
default = ["directml"]
# GPU through DirectML (Windows 10+, any DirectX 12 card). Still nothing is linked: it only works when the
# `onnxruntime.dll` next to the exe is the DirectML build; with the plain CPU build (or without a card) the job
# falls back to the CPU by itself.
directml = ["ort/directml"]
